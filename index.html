<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <title>진리로교회</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" href="./Icon.png">
  <link rel="apple-touch-icon" href="./Icon.png">
  <meta name="theme-color" content="#ffffff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="진리로교회">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
    }
    #pwa-shell {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      padding-left: env(safe-area-inset-left, 0px);
      padding-right: env(safe-area-inset-right, 0px);
      display: flex;
      flex-direction: column;
      background: #ffffff;
    }
    #app-frame {
      width: 100%;
      flex: 1;
      border: 0;
      display: block;
      background: #ffffff;
    }
    #setup-warning {
      display: none;
      padding: 28px 20px;
      text-align: center;
      color: #1e293b;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div id="pwa-shell">
    <div id="setup-warning">
      <h3 style="color:#dc2626; margin-bottom:8px;">⚠️ 웹앱 주소 설정 필요</h3>
      <p style="font-size:14px;">GitHub의 <code>index.html</code> 파일에서 <code>GAS_WEBAPP_URL</code>에<br>구글 Apps Script 배포 주소(<code>.../exec</code>)를 입력해 주세요.</p>
    </div>
    <iframe
      id="app-frame"
      title="진리로교회"
      allow="autoplay; clipboard-read; clipboard-write; fullscreen; web-share"
      allowfullscreen
    ></iframe>
  </div>

  <script>
    // ========================================================================
    // ★ [필수] 아래 따옴표 안에 구글 Apps Script 웹앱 배포 주소(.../exec)를 붙여넣으세요!
    // ========================================================================
    const GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbyMGBhLugLehVIBEO_TTK3EucQ4_mGmjLo3bPhT30i-TyuMV3W4aqwthRjzrADjjQLw/exec";

    const GOOGLE_CLIENT_ID = "9947286323-k5bo8cr27vfk80180p3m7conuvrb56h4.apps.googleusercontent.com";
    const TOKEN_STORAGE_KEY = "jinri_pwa_id_token_v1";
    const ALLOWED_PREFIX = "jinri_";

    let cachedIdToken = "";
    let gasFrameSource = null;

    // 1. Service Worker 등록 (안드로이드/데스크톱 PWA 앱 설치 지원)
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function() {
        navigator.serviceWorker.register("./sw.js").catch(function() {});
      });
    }

    // 2. URL 해시(#id_token=...) 또는 저장소에서 토큰 읽기
    function extractAndStoreInitialToken() {
      try {
        if (window.location.hash && window.location.hash.indexOf("id_token=") !== -1) {
          const params = new URLSearchParams(window.location.hash.substring(1));
          const hashToken = params.get("id_token");
          if (hashToken) {
            cachedIdToken = hashToken;
            try { localStorage.setItem(TOKEN_STORAGE_KEY, hashToken); } catch (e) {}
            try { sessionStorage.setItem(TOKEN_STORAGE_KEY, hashToken); } catch (e) {}
          }
          try {
            history.replaceState(null, "", window.location.pathname + window.location.search);
          } catch (e) {}
        }
      } catch (e) {}

      if (!cachedIdToken) {
        try {
          cachedIdToken = sessionStorage.getItem(TOKEN_STORAGE_KEY) || localStorage.getItem(TOKEN_STORAGE_KEY) || "";
        } catch (e) {}
      }
    }

    function clearStoredToken() {
      cachedIdToken = "";
      try { localStorage.removeItem(TOKEN_STORAGE_KEY); } catch (e) {}
      try { sessionStorage.removeItem(TOKEN_STORAGE_KEY); } catch (e) {}
    }

    // 3. 아이폰(iOS) ITP 대응: 1st-party localStorage 데이터를 iframe에 동기화
    function collectJinriStorageSnapshot() {
      const snapshot = {};
      try {
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k && k.indexOf(ALLOWED_PREFIX) === 0 && k !== TOKEN_STORAGE_KEY) {
            snapshot[k] = localStorage.getItem(k);
          }
        }
      } catch (e) {}
      return snapshot;
    }

    // 4. Google OAuth 로그인 시작 (모든 OS에서 팝업 차단 없이 동작하는 동일 출처 리디렉션)
    function startPwaGoogleOAuth() {
      const redirectUri = new URL("./auth.html", window.location.href).href;
      const nonce = (window.crypto && typeof window.crypto.randomUUID === "function")
        ? window.crypto.randomUUID()
        : (String(Date.now()) + "_" + Math.random().toString(36).slice(2));
      const params = new URLSearchParams({
        client_id: GOOGLE_CLIENT_ID,
        redirect_uri: redirectUri,
        response_type: "id_token",
        scope: "openid email profile",
        nonce: nonce,
        prompt: "select_account"
      });
      window.location.href = "https://accounts.google.com/o/oauth2/v2/auth?" + params.toString();
    }

    // 5. iframe(Apps Script) <-> GitHub PWA 브리지 통신
    window.addEventListener("message", function(e) {
      const data = e && e.data;
      if (!data || typeof data !== "object") return;

      if (data.type === "JINRI_IFRAME_READY") {
        gasFrameSource = e.source;
        if (gasFrameSource && typeof gasFrameSource.postMessage === "function") {
          gasFrameSource.postMessage({
            type: "JINRI_PWA_INIT",
            idToken: cachedIdToken || "",
            storage: collectJinriStorageSnapshot()
          }, "*");
        }
      } else if (data.type === "JINRI_START_OAUTH") {
        startPwaGoogleOAuth();
      } else if (data.type === "JINRI_LOGOUT" || data.type === "JINRI_AUTH_FAILED") {
        clearStoredToken();
      } else if (data.type === "JINRI_STORAGE_SET") {
        const k = String(data.key || "");
        if (k.indexOf(ALLOWED_PREFIX) === 0 && k !== TOKEN_STORAGE_KEY) {
          try { localStorage.setItem(k, String(data.value)); } catch (err) {}
        }
      } else if (data.type === "JINRI_STORAGE_REMOVE") {
        const k = String(data.key || "");
        if (k.indexOf(ALLOWED_PREFIX) === 0 && k !== TOKEN_STORAGE_KEY) {
          try { localStorage.removeItem(k); } catch (err) {}
        }
      } else if (data.type === "JINRI_COPY_TEXT") {
        const txt = String(data.text || "");
        if (txt && navigator.clipboard && typeof navigator.clipboard.writeText === "function") {
          navigator.clipboard.writeText(txt).catch(function() {});
        }
      }
    });

    // 6. 초기화 및 앱 iframe 로드
    extractAndStoreInitialToken();
    const frameEl = document.getElementById("app-frame");
    const warnEl = document.getElementById("setup-warning");
    if (!GAS_WEBAPP_URL || GAS_WEBAPP_URL.indexOf("https://script.google.com/") !== 0) {
      frameEl.style.display = "none";
      warnEl.style.display = "block";
    } else {
      frameEl.src = GAS_WEBAPP_URL;
    }
  </script>
</body>
</html>
