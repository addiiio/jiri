<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta id="pwa-viewport-meta" name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>진리로교회</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" href="./Icon.png">
  <link rel="apple-touch-icon" href="./Icon.png">
  <meta name="theme-color" content="#ffffff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="진리로교회">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      -webkit-text-size-adjust: 100%;
      touch-action: manipulation;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
    }
    #pwa-shell {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      padding-left: env(safe-area-inset-left, 0px);
      padding-right: env(safe-area-inset-right, 0px);
      display: flex;
      flex-direction: column;
      background: #ffffff;
    }
    #install-banner {
      display: none;
      background: #eff6ff;
      border-bottom: 1.5px solid #93c5fd;
      padding: 10px 12px;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
      z-index: 999;
    }
    #install-banner.show {
      display: flex;
    }
    #install-cta-btn {
      flex: 1;
      background: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      text-align: center;
      box-shadow: 0 2px 6px rgba(37, 99, 235, 0.25);
    }
    #install-cta-btn:active {
      background: #1d4ed8;
    }
    #install-guide-text {
      display: none;
      flex: 1;
      font-size: 14px;
      font-weight: 700;
      color: #1e3a8a;
      line-height: 1.45;
    }
    #install-dismiss-btn {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      color: #64748b;
      border-radius: 8px;
      width: 34px;
      height: 34px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    #app-frame {
      width: 100%;
      flex: 1;
      border: 0;
      display: block;
      background: #ffffff;
    }
    #setup-warning {
      display: none;
      padding: 28px 20px;
      text-align: center;
      color: #1e293b;
      line-height: 1.6;
    }
    #pwa-back-toast {
      display: none;
      position: fixed;
      bottom: calc(28px + env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.92);
      color: #ffffff;
      padding: 11px 18px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      z-index: 10000;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
      max-width: 90vw;
      text-align: center;
      line-height: 1.4;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="pwa-shell">
    <div id="install-banner">
      <button type="button" id="install-cta-btn">📲 진리로교회 앱 설치하기</button>
      <div id="install-guide-text"></div>
      <button type="button" id="install-dismiss-btn" title="닫기">✕</button>
    </div>
    <div id="setup-warning">
      <h3 style="color:#dc2626; margin-bottom:8px;">⚠️ 웹앱 주소 설정 필요</h3>
      <p style="font-size:14px;">GitHub의 <code>index.html</code> 파일에서 <code>GAS_WEBAPP_URL</code>에<br>구글 Apps Script 배포 주소(<code>.../exec</code>)를 입력해 주세요.</p>
    </div>
    <iframe
      id="app-frame"
      title="진리로교회"
      allow="autoplay; clipboard-read; clipboard-write; fullscreen; web-share; microphone"
      allowfullscreen
    ></iframe>
  </div>
  <div id="pwa-back-toast"></div>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-messaging-compat.js"></script>
  <script>
    // ★ [필수] 파이어베이스 콘솔 [프로젝트 설정 → 클라우드 메시징 → 웹 푸시 인증서]에서
    // [키 쌍 생성]으로 발급받은 공개 키(VAPID Key)를 아래 따옴표 안에 붙여넣으세요!
    const VAPID_PUBLIC_KEY = "";

    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyC2D3av97eAFqyOibTVHsAbkLVTbF2SyTo",
      authDomain: "jiri-805c8.firebaseapp.com",
      projectId: "jiri-805c8",
      storageBucket: "jiri-805c8.firebasestorage.app",
      messagingSenderId: "327026457231",
      appId: "1:327026457231:web:ea72faeff93bc0e0b74efa"
    };

    const GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbyMGBhLugLehVIBEO_TTK3EucQ4_mGmjLo3bPhT30i-TyuMV3W4aqwthRjzrADjjQLw/exec";
    const GOOGLE_CLIENT_ID = "9947286323-k5bo8cr27vfk80180p3m7conuvrb56h4.apps.googleusercontent.com";
    const TOKEN_STORAGE_KEY = "jinri_pwa_id_token_v1";
    const ALLOWED_PREFIX = "jinri_";

    let cachedIdToken = "";
    let gasFrameSource = null;
    let deferredInstallPrompt = null;

    // 0. 카카오톡 인앱 브라우저 자동 탈출 (안드로이드)
    (function escapeInAppBrowser() {
      const ua = navigator.userAgent || "";
      if (/KAKAOTALK/i.test(ua) && /Android/i.test(ua)) {
        window.location.href = "kakaotalk://web/openExternal?url=" + encodeURIComponent(window.location.href);
      }
    })();

    // 0-1. 앱 설치 배너 제어
    function isRunningStandalone() {
      return (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) ||
        window.navigator.standalone === true;
    }

    const installBanner = document.getElementById("install-banner");
    const installCtaBtn = document.getElementById("install-cta-btn");
    const installGuideText = document.getElementById("install-guide-text");
    const installDismissBtn = document.getElementById("install-dismiss-btn");

    if (installDismissBtn) {
      installDismissBtn.addEventListener("click", function() {
        installBanner.classList.remove("show");
      });
    }

    window.addEventListener("beforeinstallprompt", function(e) {
      e.preventDefault();
      deferredInstallPrompt = e;
      if (!isRunningStandalone()) {
        installGuideText.style.display = "none";
        installCtaBtn.style.display = "block";
        installCtaBtn.innerText = "📲 진리로교회 앱 설치하기";
        installBanner.classList.add("show");
      }
    });

    if (installCtaBtn) {
      installCtaBtn.addEventListener("click", async function() {
        if (deferredInstallPrompt) {
          try {
            deferredInstallPrompt.prompt();
            const choice = await deferredInstallPrompt.userChoice;
            if (choice && choice.outcome === "accepted") {
              installBanner.classList.remove("show");
            }
          } catch (err) {}
          deferredInstallPrompt = null;
        } else {
          installCtaBtn.style.display = "none";
          installGuideText.style.display = "block";
          installGuideText.innerHTML = "브라우저 메뉴(⋮ 또는 ≡) → <b>[앱 설치]</b> 또는 <b>[홈 화면에 추가]</b>를 눌러주세요.";
        }
      });
    }

    window.addEventListener("appinstalled", function() {
      deferredInstallPrompt = null;
      installBanner.classList.remove("show");
    });

    (function initOsInstallBanner() {
      if (isRunningStandalone()) return;
      const ua = navigator.userAgent || "";
      const isIos = /iPhone|iPad|iPod/i.test(ua);
      const isAndroid = /Android/i.test(ua);
      if (isIos) {
        installCtaBtn.style.display = "none";
        installGuideText.style.display = "block";
        const shareSvg = '<svg style="width:16px;height:16px;vertical-align:-2px;margin:0 2px;color:#2563eb;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M8 7l4-4 4 4"/><path d="M4 11v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/></svg>';
        if (/KAKAOTALK/i.test(ua)) {
          installGuideText.innerHTML = '📲 <b>우측 하단 [⋯] → Safari로 열기</b> 후<br>공유(' + shareSvg + ') → <b>[홈 화면에 추가]</b>를 눌러주세요.';
        } else {
          installGuideText.innerHTML = '📲 하단 <b>공유 버튼(' + shareSvg + ') → [홈 화면에 추가]</b>를<br>누르면 앱처럼 바로 사용할 수 있습니다.';
        }
        installBanner.classList.add("show");
      } else if (isAndroid && /SamsungBrowser/i.test(ua)) {
        setTimeout(function() {
          if (!isRunningStandalone() && !deferredInstallPrompt && !installBanner.classList.contains("show")) {
            installGuideText.style.display = "none";
            installCtaBtn.style.display = "block";
            installBanner.classList.add("show");
          }
        }, 1200);
      }
    })();

    // 1. Service Worker 등록 및 Firebase FCM 푸시 초기화
    let swRegistrationRef = null;
    let firebaseMessagingRef = null;

    function notifyIframePushStatus() {
      if (!gasFrameSource || typeof gasFrameSource.postMessage !== "function") return;
      let status = "unsupported";
      if ("Notification" in window && "serviceWorker" in navigator && VAPID_PUBLIC_KEY) {
        status = Notification.permission || "default";
      }
      try { gasFrameSource.postMessage({ type: "JINRI_PUSH_STATUS", status: status }, "*"); } catch (e) {}
    }

    function showLocalOrSwNotification(title, body) {
      const t = String(title || "진리로교회 알림");
      const b = String(body || "");
      if (!("Notification" in window) || Notification.permission !== "granted") return;
      const opts = { body: b, icon: "./Icon.png", badge: "./Icon.png" };
      if (swRegistrationRef && typeof swRegistrationRef.showNotification === "function") {
        swRegistrationRef.showNotification(t, opts).catch(function() {
          try { new Notification(t, opts); } catch (e) {}
        });
      } else {
        try { new Notification(t, opts); } catch (e) {}
      }
    }

    async function fetchAndSendFcmToken(askPermissionIfDefault) {
      if (!VAPID_PUBLIC_KEY || !("Notification" in window) || !("serviceWorker" in navigator)) {
        notifyIframePushStatus();
        return;
      }
      try {
        if (!swRegistrationRef) {
          swRegistrationRef = await navigator.serviceWorker.register("./sw.js");
        }
        let perm = Notification.permission;
        if (perm === "default" && askPermissionIfDefault) {
          perm = await Notification.requestPermission();
        }
        notifyIframePushStatus();
        if (perm !== "granted") return;
        if (typeof firebase === "undefined") return;
        if (!firebase.apps || firebase.apps.length === 0) {
          firebase.initializeApp(FIREBASE_CONFIG);
        }
        if (!firebaseMessagingRef && firebase.messaging && firebase.messaging.isSupported && firebase.messaging.isSupported()) {
          firebaseMessagingRef = firebase.messaging();
          firebaseMessagingRef.onMessage(function(payload) {
            const n = payload && payload.notification ? payload.notification : {};
            showLocalOrSwNotification(n.title || "진리로교회 알림", n.body || "");
          });
        }
        if (!firebaseMessagingRef) return;
        const token = await firebaseMessagingRef.getToken({
          vapidKey: VAPID_PUBLIC_KEY,
          serviceWorkerRegistration: swRegistrationRef
        });
        if (token && gasFrameSource && typeof gasFrameSource.postMessage === "function") {
          gasFrameSource.postMessage({ type: "JINRI_FCM_TOKEN", token: token }, "*");
        }
      } catch (err) {}
    }

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function() {
        navigator.serviceWorker.register("./sw.js").then(function(reg) {
          swRegistrationRef = reg;
          if ("Notification" in window && Notification.permission === "granted") {
            fetchAndSendFcmToken(false);
          }
        }).catch(function() {});
      });
    }

    // 1-1. 뒤로가기 버튼 2회 눌러 종료 방지 가드 (오디오 재생 끊김 방지)
    let pwaBackToastTimer = null;
    let pwaLastBackAt = 0;
    let pwaOverlayWaitTimer = null;
    let pwaAllowExit = false;

    function showPwaBackToast(msg) {
      const el = document.getElementById("pwa-back-toast");
      if (!el) return;
      el.innerText = msg;
      el.style.display = "block";
      if (pwaBackToastTimer) clearTimeout(pwaBackToastTimer);
      pwaBackToastTimer = setTimeout(function() {
        el.style.display = "none";
      }, 2200);
    }

    function armBackGuardState() {
      try {
        history.pushState({ pwaGuard: true }, "", window.location.href);
      } catch (e) {}
    }
    armBackGuardState();

    function handleNoOverlayBackPress(isAudioPlaying) {
      pwaLastBackAt = Date.now();
      if (isAudioPlaying) {
        showPwaBackToast("🎧 재생 중입니다. 한 번 더 누르면 종료됩니다. (계속 들으려면 홈 버튼)");
      } else {
        showPwaBackToast("뒤로 버튼을 한 번 더 누르면 앱이 종료됩니다.");
      }
    }

    window.addEventListener("popstate", function() {
      if (pwaAllowExit) return;
      const now = Date.now();
      if (now - pwaLastBackAt < 2200) {
        pwaAllowExit = true;
        history.back();
        return;
      }
      armBackGuardState();
      if (gasFrameSource && typeof gasFrameSource.postMessage === "function") {
        if (pwaOverlayWaitTimer) clearTimeout(pwaOverlayWaitTimer);
        pwaOverlayWaitTimer = setTimeout(function() {
          pwaOverlayWaitTimer = null;
          handleNoOverlayBackPress(false);
        }, 180);
        try { gasFrameSource.postMessage({ type: "JINRI_CHECK_CLOSE_OVERLAY" }, "*"); } catch (e) {}
      } else {
        handleNoOverlayBackPress(false);
      }
    });

    // 2. 토큰 읽기 및 관리
    function extractAndStoreInitialToken() {
      try {
        if (window.location.hash && window.location.hash.indexOf("id_token=") !== -1) {
          const params = new URLSearchParams(window.location.hash.substring(1));
          const hashToken = params.get("id_token");
          if (hashToken) {
            cachedIdToken = hashToken;
            try { localStorage.setItem(TOKEN_STORAGE_KEY, hashToken); } catch (e) {}
            try { sessionStorage.setItem(TOKEN_STORAGE_KEY, hashToken); } catch (e) {}
          }
          try {
            history.replaceState(null, "", window.location.pathname + window.location.search);
          } catch (e) {}
        }
      } catch (e) {}

      if (!cachedIdToken) {
        try {
          cachedIdToken = sessionStorage.getItem(TOKEN_STORAGE_KEY) || localStorage.getItem(TOKEN_STORAGE_KEY) || "";
        } catch (e) {}
      }
    }

    function clearStoredToken() {
      cachedIdToken = "";
      try { localStorage.removeItem(TOKEN_STORAGE_KEY); } catch (e) {}
      try { sessionStorage.removeItem(TOKEN_STORAGE_KEY); } catch (e) {}
    }

    // 3. 1st-party localStorage 동기화
    function collectJinriStorageSnapshot() {
      const snapshot = {};
      try {
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k && k.indexOf(ALLOWED_PREFIX) === 0 && k !== TOKEN_STORAGE_KEY) {
            snapshot[k] = localStorage.getItem(k);
          }
        }
      } catch (e) {}
      return snapshot;
    }

    // 4. Google OAuth 로그인
    function startPwaGoogleOAuth() {
      const redirectUri = new URL("./auth.html", window.location.href).href;
      const nonce = (window.crypto && typeof window.crypto.randomUUID === "function")
        ? window.crypto.randomUUID()
        : (String(Date.now()) + "_" + Math.random().toString(36).slice(2));
      const params = new URLSearchParams({
        client_id: GOOGLE_CLIENT_ID,
        redirect_uri: redirectUri,
        response_type: "id_token",
        scope: "openid email profile",
        nonce: nonce,
        prompt: "select_account"
      });
      window.location.href = "https://accounts.google.com/o/oauth2/v2/auth?" + params.toString();
    }

    // 4-1. 외부 앱(네이버 앱 등) 안전 실행 헬퍼 (최상위 창에서 실행)
    function openNaverOrExternalApp(origUrl) {
      if (!origUrl) return;
      const ua = navigator.userAgent || "";
      const isAndroid = /Android/i.test(ua);
      const isIos = /iPhone|iPad|iPod/i.test(ua);
      const isNaverBlogOrCafe = /(?:m\.)?(?:blog|cafe)\.naver\.com/i.test(origUrl);

      if (isNaverBlogOrCafe) {
        // 네이버 공식 통합앱(NAVER App) Universal Link / Custom Scheme 사용
        const naverAppInAppUrl = "naversearchapp://inappbrowser?url=" + encodeURIComponent(origUrl) + "&target=new&version=6";
        if (isAndroid) {
          const fallbackEncoded = encodeURIComponent(origUrl);
          const intentUrl = "intent://inappbrowser?url=" + fallbackEncoded + "&target=new&version=6#Intent;scheme=naversearchapp;package=com.nhn.android.search;S.browser_fallback_url=" + fallbackEncoded + ";end";
          window.location.href = intentUrl;
          return;
        } else if (isIos) {
          let appOpened = false;
          const onVis = function() {
            if (document.hidden) appOpened = true;
          };
          document.addEventListener("visibilitychange", onVis);
          window.location.href = naverAppInAppUrl;
          setTimeout(function() {
            document.removeEventListener("visibilitychange", onVis);
            if (!appOpened) {
              window.open(origUrl, "_blank", "noopener,noreferrer");
            }
          }, 1300);
          return;
        }
      }
      window.open(origUrl, "_blank", "noopener,noreferrer");
    }

    // 5. iframe <-> GitHub PWA 브리지 통신
    window.addEventListener("message", function(e) {
      const data = e && e.data;
      if (!data || typeof data !== "object") return;

      if (data.type === "JINRI_IFRAME_READY") {
        gasFrameSource = e.source;
        if (gasFrameSource && typeof gasFrameSource.postMessage === "function") {
          gasFrameSource.postMessage({
            type: "JINRI_PWA_INIT",
            idToken: cachedIdToken || "",
            storage: collectJinriStorageSnapshot()
          }, "*");
        }
      } else if (data.type === "JINRI_START_OAUTH") {
        startPwaGoogleOAuth();
      } else if (data.type === "JINRI_LOGOUT" || data.type === "JINRI_AUTH_FAILED") {
        clearStoredToken();
      } else if (data.type === "JINRI_RELOAD_APP") {
        // iframe 내부 reload() 대신 최상위 PWA 페이지 전체를 깔끔하게 재시작
        window.location.reload();
      } else if (data.type === "JINRI_OPEN_EXTERNAL") {
        openNaverOrExternalApp(String(data.url || ""));
      } else if (data.type === "JINRI_STORAGE_SET") {
        const k = String(data.key || "");
        if (k.indexOf(ALLOWED_PREFIX) === 0 && k !== TOKEN_STORAGE_KEY) {
          try { localStorage.setItem(k, String(data.value)); } catch (err) {}
        }
      } else if (data.type === "JINRI_STORAGE_REMOVE") {
        const k = String(data.key || "");
        if (k.indexOf(ALLOWED_PREFIX) === 0 && k !== TOKEN_STORAGE_KEY) {
          try { localStorage.removeItem(k); } catch (err) {}
        }
      } else if (data.type === "JINRI_COPY_TEXT") {
        const txt = String(data.text || "");
        if (txt && navigator.clipboard && typeof navigator.clipboard.writeText === "function") {
          navigator.clipboard.writeText(txt).catch(function() {});
        }
      } else if (data.type === "JINRI_SET_ZOOM") {
        setPwaZoomAllowed(Boolean(data.allow));
      } else if (data.type === "JINRI_REQUEST_PUSH_INIT") {
        notifyIframePushStatus();
        fetchAndSendFcmToken(false);
      } else if (data.type === "JINRI_REQUEST_PUSH_PERMISSION") {
        fetchAndSendFcmToken(true);
      } else if (data.type === "JINRI_LOCAL_NOTIFY") {
        showLocalOrSwNotification(data.title || "진리로교회 알림", data.body || "");
      } else if (data.type === "JINRI_OVERLAY_RESULT") {
        if (pwaOverlayWaitTimer) {
          clearTimeout(pwaOverlayWaitTimer);
          pwaOverlayWaitTimer = null;
        }
        if (!data.closed) {
          handleNoOverlayBackPress(Boolean(data.isAudioPlaying));
        }
      }
    });

    // 5-1. iOS 앱 전환 복귀 시 화면 확대 버그 방지 및 주보 확대 연동
    let isPwaZoomAllowed = false;
    function setPwaZoomAllowed(allow) {
      isPwaZoomAllowed = Boolean(allow);
      const vp = document.getElementById("pwa-viewport-meta");
      if (!vp) return;
      if (isPwaZoomAllowed) {
        vp.setAttribute("content", "width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover");
      } else {
        vp.setAttribute("content", "width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover");
        try { window.scrollTo(0, 0); } catch (e) {}
      }
    }
    function resetIosZoomOnResume() {
      if (isPwaZoomAllowed) return;
      const vp = document.getElementById("pwa-viewport-meta");
      if (vp) {
        vp.setAttribute("content", "width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover");
      }
      try { window.scrollTo(0, 0); } catch (e) {}
    }
    document.addEventListener("visibilitychange", function() {
      if (document.visibilityState === "visible") {
        resetIosZoomOnResume();
        setTimeout(resetIosZoomOnResume, 150);
      }
    });
    window.addEventListener("pageshow", resetIosZoomOnResume);
    window.addEventListener("focus", resetIosZoomOnResume);

    // 6. 초기화 및 앱 iframe 로드
    extractAndStoreInitialToken();
    const frameEl = document.getElementById("app-frame");
    const warnEl = document.getElementById("setup-warning");
    if (!GAS_WEBAPP_URL || GAS_WEBAPP_URL.indexOf("https://script.google.com/") !== 0) {
      frameEl.style.display = "none";
      warnEl.style.display = "block";
    } else {
      frameEl.src = GAS_WEBAPP_URL;
    }
    </script>
  <script>
  (function() {
    let pwaVoiceRec = null;

    function postToAppFrame(sourceWin, payload) {
      try {
        if (sourceWin && typeof sourceWin.postMessage === "function") {
          sourceWin.postMessage(payload, "*");
          return;
        }
      } catch (e) {}
      try {
        const frame = document.querySelector("iframe");
        if (frame && frame.contentWindow) {
          frame.contentWindow.postMessage(payload, "*");
        }
      } catch (e) {}
    }

    window.addEventListener("message", function(e) {
      const data = e && e.data;
      if (!data || typeof data !== "object") return;

      if (data.type === "JINRI_STOP_VOICE") {
        if (pwaVoiceRec) {
          try { pwaVoiceRec.stop(); } catch (err) {}
          pwaVoiceRec = null;
        }
        return;
      }

      if (data.type === "JINRI_START_VOICE") {
        const targetWin = e.source;
        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRec) {
          postToAppFrame(targetWin, {
            type: "JINRI_VOICE_ERROR",
            message: "이 브라우저에서는 음성 인식을 지원하지 않습니다. 키보드 마이크를 이용해 주세요."
          });
          return;
        }

        if (pwaVoiceRec) {
          try { pwaVoiceRec.abort(); } catch (err) {}
          pwaVoiceRec = null;
        }

        try {
          const rec = new SpeechRec();
          rec.lang = data.lang || "ko-KR";
          rec.interimResults = false;
          rec.maxAlternatives = 1;
          pwaVoiceRec = rec;

          rec.onstart = function() {
            postToAppFrame(targetWin, { type: "JINRI_VOICE_START" });
          };

          rec.onresult = function(ev) {
            const transcript =
              ev && ev.results && ev.results[0] && ev.results[0][0]
                ? String(ev.results[0][0].transcript || "").trim()
                : "";
            pwaVoiceRec = null;
            postToAppFrame(targetWin, {
              type: "JINRI_VOICE_RESULT",
              transcript: transcript
            });
          };

          rec.onerror = function(ev) {
            pwaVoiceRec = null;
            const errCode = ev && ev.error ? String(ev.error) : "";
            let msg = "음성 인식에 실패했습니다. 다시 시도해 주세요.";
            if (errCode === "not-allowed" || errCode === "service-not-allowed") {
              msg = "마이크 권한이 거부되었습니다. 브라우저 설정에서 마이크를 허용해 주세요.";
            } else if (errCode === "no-speech") {
              msg = "음성이 감지되지 않았습니다. 마이크를 다시 눌러 말씀해 주세요.";
            } else if (errCode === "audio-capture") {
              msg = "사용 가능한 마이크를 찾을 수 없습니다.";
            }
            postToAppFrame(targetWin, { type: "JINRI_VOICE_ERROR", message: msg });
          };

          rec.onend = function() {
            pwaVoiceRec = null;
            postToAppFrame(targetWin, { type: "JINRI_VOICE_END" });
          };

          rec.start();
        } catch (err) {
          pwaVoiceRec = null;
          postToAppFrame(targetWin, {
            type: "JINRI_VOICE_ERROR",
            message: "음성 인식을 시작할 수 없습니다."
          });
        }
      }
    });
  })();
</script>
