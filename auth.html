<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>진리로교회 로그인 처리 중...</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      color: #1e3a8a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      font-size: 15px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div>로그인 처리 중입니다...</div>
  <script>
    (function() {
      const TOKEN_STORAGE_KEY = "jinri_pwa_id_token_v1";
      let idToken = "";
      try {
        if (window.location.hash && window.location.hash.length > 1) {
          const params = new URLSearchParams(window.location.hash.substring(1));
          idToken = params.get("id_token") || "";
        }
      } catch (e) {}

      if (idToken) {
        try { localStorage.setItem(TOKEN_STORAGE_KEY, idToken); } catch (e) {}
        try { sessionStorage.setItem(TOKEN_STORAGE_KEY, idToken); } catch (e) {}
        window.location.replace("./#id_token=" + encodeURIComponent(idToken));
      } else {
        window.location.replace("./");
      }
    })();
  </script>
</body>
</html>
